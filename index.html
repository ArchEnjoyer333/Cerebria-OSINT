<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cerebria</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            main: 'var(--bg-main)',
                            sidebar: 'var(--bg-sidebar)',
                            card: 'var(--bg-card)',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="h-screen overflow-hidden flex flex-col md:flex-row antialiased selection:bg-white selection:text-black">

    <!-- Сайдбар -->
    <aside class="w-full md:w-80 theme-sidebar border-b md:border-b-0 md:border-r border-white/[0.06] flex flex-col justify-between p-7 shrink-0 z-20">
        <div class="space-y-7">
            <div>
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-2xl overflow-hidden shadow-[0_0_25px_rgba(255,255,255,0.06)] border border-white/[0.1] transition-transform duration-500 hover:scale-105">
                        <img id="sidebarLogo" src="/logo.svg" alt="Logo" class="w-full h-full object-cover select-none" onerror="this.style.display='none'" />
                    </div>
                    <div>
                        <span id="appName" class="text-2xl font-extrabold tracking-tight text-white block leading-none">Cerebria</span>
                        <span id="appStatus" class="text-xs font-semibold text-neutral-500 tracking-wide mt-1 block">Beta v0.1.0</span>
                    </div>
                </div>
            </div>

            <div id="dynamicLinksContainer" class="grid grid-cols-2 gap-2.5"></div>

            <div class="space-y-3">
                <span class="text-[11px] font-bold text-neutral-500 uppercase tracking-widest px-2 font-mono">Modules</span>
                <nav id="modulesList" class="space-y-1.5 pt-1"></nav>
            </div>
        </div>

        <div class="pt-6 border-t border-white/[0.06] flex items-center justify-between text-sm text-neutral-500 font-medium">
            <span class="flex items-center gap-2 font-mono text-xs">
                <span class="w-2 h-2 rounded-full bg-white shadow-[0_0_8px_rgba(255,255,255,0.9)] animate-pulse"></span>
                <span id="serverHostBadge">Localhost</span>
            </span>
        </div>
    </aside>

    <!-- Основная рабочая область -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
        <header id="topBar" class="h-16 flex items-center justify-end px-10 shrink-0 bg-transparent absolute top-0 right-0 w-full z-10 opacity-0 transition-opacity duration-500 pointer-events-none">
            <button onclick="copyRawJson()" class="text-xs font-mono text-neutral-400 hover:text-white bg-white/[0.03] hover:bg-white/[0.08] border border-white/[0.08] px-4 py-2 rounded-xl transition-all duration-300 active:scale-95 shadow-sm pointer-events-auto">
                <span id="copyStatus">Copy Payload JSON</span>
            </button>
        </header>

        <div id="scrollContainer" class="flex-1 overflow-y-auto relative z-0">
            <div id="errorBox" class="hidden absolute top-6 left-1/2 -translate-x-1/2 p-4 bg-neutral-900/90 border border-red-500/30 rounded-2xl text-red-200 text-sm font-mono backdrop-blur-xl animate-fade-in max-w-2xl w-full mx-auto shadow-2xl z-50 text-center"></div>

            <!-- Экран приветствия -->
            <div id="welcomeView" class="h-full flex flex-col items-center justify-center text-center p-10 animate-fade-in">
                <div class="w-20 h-20 rounded-3xl bg-white/[0.02] border border-white/[0.06] flex items-center justify-center mb-8 shadow-2xl overflow-hidden p-4 transition-transform duration-700 hover:scale-105">
                    <img id="welcomeIcon" src="/logo.svg" alt="Welcome Icon" class="w-full h-full object-contain select-none opacity-80" />
                </div>
                <h2 id="welcomeTitle" class="text-4xl sm:text-5xl font-extrabold text-white tracking-tight mb-4">Welcome to Cerebria.</h2>
                <p id="welcomeSubtitle" class="text-neutral-400 font-medium text-base max-w-md">Select an intelligence module from the sidebar to start your investigation.</p>
            </div>

            <!-- Рабочая область модуля -->
            <div id="workspaceView" class="hidden-view flex flex-col p-8 md:p-12 lg:p-16 max-w-5xl mx-auto w-full min-h-full">
                <div class="mb-8 animate-fade-up">
                    <h1 id="modTitle" class="text-3xl font-extrabold text-white tracking-tight mb-2">Module Name</h1>
                    <p id="modDesc" class="text-neutral-400 text-base font-medium">Module description goes here.</p>
                </div>

                <div class="animate-fade-up" style="animation-delay: 0.08s;">
                    <div class="bg-neutral-950/60 border border-white/[0.08] rounded-2xl p-2 pl-5 flex items-center gap-4 transition-all duration-500 focus-within:border-white/[0.25] focus-within:bg-neutral-950 shadow-2xl backdrop-blur-md">
                        <svg class="w-5 h-5 text-neutral-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                        <input id="targetInput" type="text" placeholder="Enter target..." class="flex-1 bg-transparent border-none py-3.5 text-base font-medium text-white placeholder-neutral-600 focus:outline-none font-mono" onkeydown="if(event.key === 'Enter') lookup()" />
                        <button onclick="lookup()" id="searchBtn" class="bg-white hover:bg-neutral-200 text-black font-bold text-xs font-mono uppercase tracking-wider px-7 py-3.5 rounded-xl transition-all duration-300 active:scale-95 flex items-center gap-2 shrink-0">Execute</button>
                    </div>
                </div>

                <!-- Блок результатов -->
                <div id="resultBox" class="hidden mt-10 space-y-6 animate-fade-up">
                    <!-- Hero Header -->
                    <div class="theme-card border border-white/[0.08] p-7 rounded-3xl flex flex-wrap items-center justify-between gap-6 shadow-2xl">
                        <div class="flex items-center gap-5">
                            <div id="heroBadge" class="w-12 h-12 rounded-2xl bg-white/[0.04] border border-white/[0.08] flex items-center justify-center font-mono text-sm font-bold text-white shadow-inner">IP</div>
                            <div>
                                <h3 id="heroTitle" class="text-xl font-extrabold font-mono text-white tracking-tight mb-1">-</h3>
                                <div class="flex items-center gap-3 text-xs font-mono">
                                    <span id="heroType" class="text-white font-medium">-</span>
                                    <span class="text-neutral-600">•</span>
                                    <span id="heroSub" class="text-neutral-400">-</span>
                                </div>
                            </div>
                        </div>
                        <div id="pivotsContainer" class="flex flex-wrap items-center gap-2"></div>
                    </div>

                    <!-- Карточки телеметрии -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div class="theme-card border border-white/[0.06] rounded-3xl p-7 space-y-4">
                            <span id="group1Title" class="text-[11px] font-mono uppercase tracking-widest text-neutral-500 font-bold block">Primary Metrics</span>
                            <div id="group1List" class="space-y-3.5 text-xs divide-y divide-white/[0.04]"></div>
                        </div>

                        <div class="theme-card border border-white/[0.06] rounded-3xl p-7 space-y-4">
                            <span id="group2Title" class="text-[11px] font-mono uppercase tracking-widest text-neutral-500 font-bold block">Telemetry Info</span>
                            <div id="group2List" class="space-y-3.5 text-xs divide-y divide-white/[0.04]"></div>
                        </div>
                    </div>

                    <!-- Сетка Detailed Attributes -->
                    <div class="theme-card border border-white/[0.06] rounded-3xl overflow-hidden shadow-xl mt-6">
                        <div class="px-7 py-4 border-b border-white/[0.06] bg-white/[0.01] flex items-center justify-between">
                            <span class="text-xs font-bold text-neutral-300 tracking-wider font-mono uppercase">Detailed Attributes</span>
                            <div class="flex gap-1.5 bg-black/50 border border-white/[0.06] p-1 rounded-xl">
                                <button id="tabFormatted" onclick="switchView('formatted')" class="px-3.5 py-1 text-[11px] font-mono rounded-lg bg-white text-black font-semibold shadow-md transition-all">Formatted</button>
                                <button id="tabRaw" onclick="switchView('raw')" class="px-3.5 py-1 text-[11px] font-mono rounded-lg text-neutral-400 hover:text-white transition-all">Raw JSON</button>
                            </div>
                        </div>
                        <div id="viewFormatted" class="p-7 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3.5"></div>
                        <div id="viewRaw" class="hidden"><pre id="resRaw" class="p-7 text-xs font-mono overflow-x-auto min-h-[220px] max-h-[480px] leading-relaxed selection:bg-neutral-800 text-neutral-400"></pre></div>
                    </div>
                </div>
            </div>
            <div class="h-20"></div>
        </div>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
