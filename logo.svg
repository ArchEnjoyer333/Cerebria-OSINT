<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Фоновый титановый градиент -->
    <radialGradient id="titaniumBg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1c1c22"/>
      <stop offset="60%" stop-color="#0e0e11"/>
      <stop offset="100%" stop-color="#050507"/>
    </radialGradient>

    <!-- Фаска и контурное освещение (Edge Lighting) -->
    <linearGradient id="bevelBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Градиенты граней кристаллических осколков -->
    <linearGradient id="shardLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d4d4d8"/>
    </linearGradient>

    <linearGradient id="shardMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e4e4e7"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>

    <linearGradient id="shardDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#71717a"/>
      <stop offset="100%" stop-color="#3f3f46"/>
    </linearGradient>

    <!-- Мягкое свечение ядра -->
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Скругленный контейнер (Squircle App Tile) -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#titaniumBg)" stroke="url(#bevelBorder)" stroke-width="2.5"/>

  <!-- Фоновое белое рассеянное свечение под знаком -->
  <circle cx="230" cy="256" r="90" fill="#ffffff" opacity="0.04" filter="url(#coreGlow)"/>

  <!-- Знак: Абстрактная буква «C» из 3 граненых полигональных осколков -->
  <g id="cerebria-emblem" filter="url(#coreGlow)">
    
    <!-- 1. Верхний граненый осколок -->
    <!-- Основная грань -->
    <polygon points="360,150 240,110 160,180 260,205 340,190" fill="url(#shardLight)"/>
    <!-- Верхняя скошенная грань -->
    <polygon points="360,150 240,110 200,140 330,170" fill="#ffffff" opacity="0.9"/>
    <!-- Нижний теневой срез -->
    <polygon points="160,180 260,205 245,225 150,195" fill="url(#shardDark)"/>

    <!-- 2. Центральный вертикальный осколок (спина литеры C) -->
    <!-- Светлая внешняя грань -->
    <polygon points="140,205 195,240 175,310 120,270" fill="url(#shardLight)"/>
    <!-- Внутренняя грань с глубиной -->
    <polygon points="195,240 235,256 215,325 175,310" fill="url(#shardMid)"/>
    <!-- Нижнее ребро -->
    <polygon points="120,270 175,310 160,335 110,290" fill="url(#shardDark)"/>

    <!-- 3. Нижний граненый осколок -->
    <!-- Основная нижняя грань -->
    <polygon points="150,325 245,295 340,330 260,395 160,340" fill="url(#shardLight)"/>
    <!-- Отражающая грань -->
    <polygon points="260,395 340,330 360,365 250,410" fill="url(#shardMid)"/>
    <!-- Внутренний срез фокуса -->
    <polygon points="150,325 245,295 230,275 140,305" fill="url(#shardDark)"/>

    <!-- Центральный микро-кристалл (фокусный визор / ядро) -->
    <polygon points="275,256 295,240 310,256 295,272" fill="#ffffff" opacity="0.8"/>
  </g>
</svg>
